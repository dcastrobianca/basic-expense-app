server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: expense-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/expense_app_db}
    username: ${DB_USER:expense_app}
    password: ${DB_PASSWORD_EXPENSE:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:

      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: always

app:
  api-key: ${EXPENSE_API_KEY:}
  rates:
    base-url: ${RATES_BASE_URL:https://api.frankfurter.dev/v1}
    connect-timeout: ${RATES_CONNECT_TIMEOUT:3s}
    read-timeout: ${RATES_READ_TIMEOUT:5s}
